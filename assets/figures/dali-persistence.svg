<!-- ダリ《記憶の固執》の水平線、段状の岩塊、暗い前景、四つの円形と中央の有機的な塊を抽象化した構図図 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 240" role="img" aria-label="記憶の固執の構図を抽象化した図">
  <g stroke="#0f0f11" stroke-width="1.2" stroke-linejoin="miter">
    <!-- 三段の空と高さ約28パーセントの水平線 -->
    <rect fill="#e8e4dd" x="0" y="0" width="330" height="22"/>
    <rect fill="#c4c0b8" x="0" y="22" width="330" height="23"/>
    <rect fill="#8e8a84" x="0" y="45" width="330" height="22"/>
    <line x1="0" y1="67" x2="330" y2="67" stroke-width="1.8"/>

    <!-- 暗い前景を不均一な面へ分割 -->
    <polygon fill="#3a3a3d" points="0,67 105,67 90,112 0,131"/>
    <polygon fill="#5c5c60" points="105,67 216,67 202,103 90,112"/>
    <polygon fill="#3a3a3d" points="216,67 330,67 330,116 202,103"/>
    <polygon fill="#0f0f11" points="0,131 90,112 111,163 0,185"/>
    <polygon fill="#3a3a3d" points="90,112 202,103 220,151 111,163"/>
    <polygon fill="#0f0f11" points="202,103 330,116 330,174 220,151"/>
    <polygon fill="#3a3a3d" points="0,185 111,163 139,240 0,240"/>
    <polygon fill="#0f0f11" points="111,163 220,151 234,240 139,240"/>
    <polygon fill="#3a3a3d" points="220,151 330,174 330,240 234,240"/>
    <!-- 光が当たる床面 -->
    <polygon fill="#5c5c60" points="91,109 181,103 204,145 107,157"/>

    <!-- 右奥の階段状岩塊 -->
    <polygon fill="#e8e4dd" points="244,67 330,67 330,40 307,42 307,49 286,49 286,57 263,57 263,63 244,63"/>
    <rect fill="#c4c0b8" x="307" y="42" width="23" height="25"/>
    <polygon fill="#e8e4dd" points="286,49 307,49 307,67 278,67"/>
    <polygon fill="#c4c0b8" points="263,57 286,57 278,67 255,67"/>
    <polygon fill="#8e8a84" points="244,63 263,63 255,67 244,67"/>
    <line x1="244" y1="67" x2="330" y2="67" stroke-width="1.6"/>

    <!-- 左端の壁、台座、枯木の抽象要素 -->
    <rect fill="#0f0f11" x="0" y="67" width="18" height="119"/>
    <polygon fill="#5c5c60" points="18,88 92,91 87,169 18,181"/>
    <polygon fill="#3a3a3d" points="18,181 87,169 102,184 25,199"/>
    <rect fill="#3a3a3d" x="55" y="58" width="5" height="86"/>
    <rect fill="#5c5c60" x="57" y="66" width="56" height="5"/>
    <polygon fill="#8e8a84" points="60,72 111,72 105,76 60,76"/>

    <!-- 中央左の直方体台座 -->
    <polygon fill="#8e8a84" points="80,104 151,100 165,114 94,120"/>
    <polygon fill="#5c5c60" points="94,120 165,114 164,164 92,171"/>
    <polygon fill="#3a3a3d" points="80,104 94,120 92,171 78,154"/>

    <!-- 1: 枝から垂れる、歪みの小さい円形 -->
    <path fill="#c4c0b8" d="M88 61 C101 57 116 60 119 69 C121 78 111 87 97 86 C85 85 78 77 80 69 C81 65 84 63 88 61 Z"/>
    <ellipse fill="#8e8a84" cx="99" cy="72" rx="13" ry="9"/>
    <line x1="99" y1="63" x2="99" y2="67"/>
    <line x1="112" y1="72" x2="108" y2="72"/>
    <line x1="99" y1="81" x2="99" y2="77"/>
    <line x1="86" y1="72" x2="90" y2="72"/>

    <!-- 2: 台座上で楕円に押し潰された円形 -->
    <path fill="#c4c0b8" d="M98 101 C112 94 146 94 160 101 C166 105 162 111 150 114 C132 119 105 116 96 110 C91 106 93 103 98 101 Z"/>
    <ellipse fill="#8e8a84" cx="128" cy="106" rx="25" ry="7"/>
    <line x1="107" y1="103" x2="113" y2="104"/>
    <line x1="128" y1="99" x2="128" y2="103"/>
    <line x1="149" y1="103" x2="143" y2="104"/>

    <!-- 4: 左手前台座上のほぼ正円 -->
    <ellipse fill="#0f0f11" cx="51" cy="137" rx="20" ry="20"/>
    <ellipse fill="#8e8a84" cx="51" cy="137" rx="14" ry="14"/>
    <line x1="51" y1="123" x2="51" y2="128"/>
    <line x1="65" y1="137" x2="60" y2="137"/>
    <line x1="51" y1="151" x2="51" y2="146"/>
    <line x1="37" y1="137" x2="42" y2="137"/>

    <!-- 中央下部の有機的な閉曲線塊 -->
    <path fill="#8e8a84" d="M123 181 C134 164 153 156 172 160 C187 163 194 176 207 182 C222 189 238 188 245 199 C252 210 243 225 226 228 C207 232 194 222 178 224 C159 227 140 230 126 219 C114 210 114 193 123 181 Z"/>
    <path fill="#5c5c60" d="M139 183 C151 171 170 169 181 178 C191 186 193 199 183 207 C171 216 148 215 137 205 C130 198 132 190 139 183 Z"/>
    <polygon fill="#3a3a3d" points="184,178 207,182 222,198 198,202"/>
    <polygon fill="#c4c0b8" points="126,219 151,210 178,224 145,229"/>

    <!-- 3: 有機的な塊の上を流れる最も歪んだ円形 -->
    <path fill="#c4c0b8" d="M151 167 C163 158 184 160 192 169 C199 176 194 184 200 191 C205 198 200 210 189 211 C178 212 174 200 166 198 C154 196 143 190 144 181 C145 175 146 171 151 167 Z"/>
    <path fill="#3a3a3d" d="M159 170 C169 165 183 167 187 173 C191 179 185 184 190 191 C193 196 189 202 183 201 C174 200 172 191 164 190 C156 189 151 184 152 178 C153 174 155 172 159 170 Z"/>
    <line x1="171" y1="165" x2="170" y2="172"/>
    <line x1="191" y1="177" x2="185" y2="180"/>
    <line x1="187" y1="205" x2="183" y2="199"/>
    <line x1="151" y1="187" x2="158" y2="185"/>
  </g>
</svg>
